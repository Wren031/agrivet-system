services:
  db:
    image: postgres:16-alpine
    container_name: agrivet-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-agrivet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-agrivet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agrivet-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  admin-web:
    build:
      context: ./client/admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: agrivet-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      - app

volumes:
  pgdata:
